  <text x="100" y="133" text-anchor="middle" font-size="6" fill="#6B7280" font-family="sans-serif">Pure Honey</text>
  <text x="100" y="143" text-anchor="middle" font-size="6" fill="#6B7280" font-family="sans-serif">500g</text>
